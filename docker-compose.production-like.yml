# Sprint 5.0 Phase 17/27 — local production simulation, NOT the deployment target itself (see
# docs/production/deployment.md for the actual reference architecture). Runs the real production
# container images (Dockerfile.api/Dockerfile.dashboard) against every service class the app expects in
# production: managed Postgres (simulated), S3-compatible storage (MinIO), an SMTP sink (Mailpit, so
# outbound email is inspectable instead of actually sent), and separate worker processes split by
# PROCESS_ROLE — proving API replicas do NOT all independently run every background poller.
#
# Usage:
#   cp .env.production.example .env.production-like   # then fill in real values
#   docker compose -f docker-compose.production-like.yml --env-file .env.production-like up --build
#
# This is for local UAT only — secrets here are throwaway dev values, never real credentials.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_workforce_os
      POSTGRES_USER: ai_workforce_os
      POSTGRES_PASSWORD: ai_workforce_os
    volumes:
      - prod-like-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_workforce_os -d ai_workforce_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ai_workforce_os
      MINIO_ROOT_PASSWORD: ai_workforce_os_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prod-like-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ai_workforce_os ai_workforce_os_minio &&
        mc mb --ignore-existing local/ai-workforce-os &&
        echo 'MinIO bucket ready.'
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI — inspect outbound mail here
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off migration + seed job, matching the real deployment sequence (docs/production/deployment.md):
  # migrations alone are not enough — the `permissions` table (agents.run, knowledge.read, billing.*, ...)
  # is populated only by the seed script, never by a migration. Skipping this step doesn't fail loudly:
  # the app boots and /health/ready reports healthy, but every organization's Owner ends up with a
  # severely restricted permission set (~29 rows instead of ~136) and the product is effectively unusable
  # — this was a real bug found and root-caused in Sprint 5.0A, not a hypothetical.
  db-migrate-and-seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ai_workforce_os:ai_workforce_os@postgres:5432/ai_workforce_os?schema=public
    entrypoint: sh
    command: >
      -c "cd /workspace &&
        ./node_modules/.bin/prisma migrate deploy --schema=database/prisma/schema.prisma &&
        node --experimental-strip-types database/prisma/seed.ts"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate-and-seed:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      # Not APP_ENV=production: AppConfig (env.schema.ts) and the legacy SecurityConfig
      # (security-config.ts) — as of Sprint 5.0B, consolidated onto one canonical field list and one HTTPS
      # policy (see env.schema.ts) — both enforce HTTPS-only URLs with no localhost exemption whenever
      # APP_ENV is "production"/"staging" (a real, correct safety guarantee for actual deployments, not a
      # bug to work around there). This local verification stack has no TLS cert, so it uses "development"
      # (APP_ENV only accepts development/test/staging/production — env.schema.ts's APP_ENV oneOf) to skip
      # that strictness, while NODE_ENV=production below still exercises the real optimized runtime build,
      # and ALLOW_DEVELOPMENT_IMPLEMENTATIONS=false (below) still keeps actual dev-only shortcuts disabled.
      # A real deployment must set APP_ENV=production with real HTTPS URLs.
      APP_ENV: development
      PROCESS_ROLE: api
      DATABASE_URL: postgresql://ai_workforce_os:ai_workforce_os@postgres:5432/ai_workforce_os?schema=public
      WEB_APP_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      JWT_ACCESS_ISSUER: ai-workforce-os
      JWT_ACCESS_AUDIENCE: ai-workforce-os
      # security-config.ts requires these five unconditionally (no default, no productionLike gate) — the
      # values here match docs/production/environment-variables.md's documented recommended values, which
      # is misleading: the docs call these "optional, defaults to ..." but the code has no fallback at all.
      PASSWORD_HASH_MEMORY_COST: "65536"
      PASSWORD_HASH_TIME_COST: "3"
      PASSWORD_HASH_PARALLELISM: "1"
      JWT_ACCESS_EXPIRES_IN_SECONDS: "900"
      REFRESH_TOKEN_EXPIRES_IN_SECONDS: "2592000"
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ai-workforce-os
      S3_ACCESS_KEY_ID: ai_workforce_os
      S3_SECRET_ACCESS_KEY: ai_workforce_os_minio
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      QUEUE_PROVIDER: postgres
      ALLOW_DEVELOPMENT_IMPLEMENTATIONS: "false"
      PUBLIC_SIGNUP_ENABLED: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a real 32+ byte secret in .env.production-like}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?set a real 32+ byte secret in .env.production-like}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set a real 32+ byte secret in .env.production-like}
      PLUGIN_SECRETS_ENCRYPTION_KEY: ${PLUGIN_SECRETS_ENCRYPTION_KEY:?set a base64 32-byte key in .env.production-like}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
      PROCESS_ROLE: scheduler

  worker-workforce:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
      PROCESS_ROLE: workforce-worker

  worker-channel:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
      PROCESS_ROLE: channel-worker

  worker-maintenance:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-env
      PROCESS_ROLE: maintenance

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
        # Not "production"/"staging": those trigger auth-constants.ts's HTTPS-only guard on
        # NEXT_PUBLIC_API_BASE_URL, which this local verification stack (plain-HTTP localhost) can't
        # satisfy. NODE_ENV=production (set separately in Dockerfile.dashboard's runtime stage) is what
        # actually controls the optimized Next.js build; this flag only gates dev-only UI affordances.
        NEXT_PUBLIC_APP_ENV: production-like
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  prod-like-postgres-data:
  prod-like-minio-data:
