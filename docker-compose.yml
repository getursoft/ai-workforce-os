services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-workforce-os-postgres
    environment:
      POSTGRES_DB: ai_workforce_os
      POSTGRES_USER: ai_workforce_os
      POSTGRES_PASSWORD: ai_workforce_os
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_workforce_os -d ai_workforce_os"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
