services:
  postgres:
    # pgvector/pgvector:pg16 is upstream postgres:16 (Debian-based) with the pgvector extension
    # preinstalled. Knowledge retrieval requires the `vector` extension (see
    # database/prisma/schema.prisma `KnowledgeChunk.embedding`); plain postgres:16-alpine cannot
    # install it. Switching images requires recreating the container and its data volume — the
    # Alpine (musl) and Debian (glibc) images are not on-disk compatible.
    image: pgvector/pgvector:pg16
    container_name: ai-workforce-os-postgres
    environment:
      POSTGRES_DB: ai_workforce_os
      POSTGRES_USER: ai_workforce_os
      POSTGRES_PASSWORD: ai_workforce_os
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_workforce_os -d ai_workforce_os"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
